// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // FCM push (expo-notifications). Plugin activates in app/build.gradle
    // only when mobile/google-services.json exists.
    // NOTE: prebuild --clean wipes this block - re-add together with the
    // cmake override below.
    classpath 'com.google.gms:google-services:4.4.2'
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Force CMake 3.30.5 for all native builds (library modules AND app).
// AGP defaults to CMake 3.22.1, whose bundled ninja fails on this repo's
// long paths (deep node_modules sources exceed Windows MAX_PATH 260 for
// object files) and whose CONFIGURE_DEPENDS glob verification loops
// ("manifest 'build.ninja' still dirty after 100 tries") on Windows.
// CMake 3.30.5 ships a long-path-aware ninja.
// NOTE: this block is wiped by `expo prebuild --clean` and must be re-added.
subprojects {
  pluginManager.withPlugin("com.android.library") {
    android.externalNativeBuild.cmake.version = "3.30.5"
  }
  pluginManager.withPlugin("com.android.application") {
    android.externalNativeBuild.cmake.version = "3.30.5"
  }
}

// Activate the google-services plugin only when the Firebase config exists
// (mobile/android/app/google-services.json, synced from mobile/ by prebuild).
subprojects {
  pluginManager.withPlugin("com.android.application") {
    if (file("google-services.json").exists()) {
      apply plugin: "com.google.gms.google-services"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
