name: Android Release

# Push a tag like mobile-v1.2.10 to build and publish a signed APK + AAB.
# The workflow file must be present on the tagged commit.
on:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://wmpxwpubfxpexybqnynz.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://aquaprime-app.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.30.5"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Configure FCM (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "FCM config installed at android/app/google-services.json."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set; building without FCM config."
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate release metadata and signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            EXPO_PUBLIC_SUPABASE_URL \
            EXPO_PUBLIC_SUPABASE_ANON_KEY
          do
            if [ -z "$(printenv "$name" || true)" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required secret/variable: %s\n' "${missing[*]}"
            echo "See mobile/keystore/README.md#github-actions-release."
            exit 1
          fi

          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            mobile-v*) ;;
            *)
              echo "::error::Tag '$TAG' must start with 'mobile-v'."
              exit 1
              ;;
          esac
          TAG_VERSION="${TAG#mobile-v}"

          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          APP_VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          GRADLE_VERSION="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)"
          GRADLE_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)"

          echo "Tag version:  $TAG_VERSION"
          echo "app.json:     $APP_VERSION (versionCode $APP_VERSION_CODE)"
          echo "build.gradle: $GRADLE_VERSION (versionCode $GRADLE_VERSION_CODE)"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match app.json '$APP_VERSION'."
            exit 1
          fi
          if [ "$APP_VERSION" != "$GRADLE_VERSION" ] || [ "$APP_VERSION_CODE" != "$GRADLE_VERSION_CODE" ]; then
            echo "::error::app.json and android/app/build.gradle are out of sync."
            echo "Run 'npx expo prebuild -p android --no-install', re-apply the release signing block, commit the result, then move the tag."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/newbizz-release.keystore"
          chmod 600 "$RUNNER_TEMP/newbizz-release.keystore"

          echo "Validating release keystore..."
          keytool -list \
            -keystore "$RUNNER_TEMP/newbizz-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Keystore decoded and verified (alias: $ANDROID_KEY_ALIAS)."

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -PNEWBIZZ_UPLOAD_STORE_FILE="$RUNNER_TEMP/newbizz-release.keystore" \
            -PNEWBIZZ_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PNEWBIZZ_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PNEWBIZZ_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify and package artifacts
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK"
          test -f "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"

          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::Release APK is debug-signed. Check the signing secrets."
            exit 1
          fi

          CERT_LINE="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner.txt" || true)"
          if [ -z "$CERT_LINE" ]; then
            echo "::error::Could not read the signing certificate SHA-256 digest."
            exit 1
          fi
          CERT_SHA256="$(printf '%s' "$CERT_LINE" | sed 's/.*digest:[[:space:]]*//' | tr -d ' :' | tr 'A-F' 'a-f')"
          test -n "$CERT_SHA256"
          printf '%s\n' "$CERT_SHA256" > "$RUNNER_TEMP/cert-sha256.txt"
          echo "Signing certificate SHA-256: $CERT_SHA256"

          if [ -n "${ANDROID_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')"
            if [ "$CERT_SHA256" != "$EXPECTED" ]; then
              echo "::error::Signing certificate does not match ANDROID_CERT_SHA256."
              echo "Refusing to publish an APK that cannot update existing installs."
              exit 1
            fi
          fi

          jarsigner -verify "$AAB" >/dev/null 2>&1

          AAB_CERT_SHA256="$(keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ' :' | tr 'A-F' 'a-f' || true)"
          if [ -z "$AAB_CERT_SHA256" ] || [ "$AAB_CERT_SHA256" != "$CERT_SHA256" ]; then
            echo "::error::AAB and APK are not signed by the same certificate."
            exit 1
          fi

          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          APK_NAME="NEWBIZZ-${VERSION}-vc${VERSION_CODE}-release.apk"
          AAB_NAME="NEWBIZZ-${VERSION}-vc${VERSION_CODE}-release.aab"

          rm -rf dist
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          cp "$AAB" "dist/$AAB_NAME"
          (cd dist && sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS.txt)

          cat dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: newbizz-android-${{ github.ref_name }}
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          APK_NAME="NEWBIZZ-${VERSION}-vc${VERSION_CODE}-release.apk"
          AAB_NAME="NEWBIZZ-${VERSION}-vc${VERSION_CODE}-release.aab"
          CERT_SHA256="$(cat "$RUNNER_TEMP/cert-sha256.txt")"
          if [ -f android/app/google-services.json ]; then
            FCM_STATUS="included"
          else
            FCM_STATUS="not included"
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## NEWBIZZ Android ${VERSION} (versionCode ${VERSION_CODE})

          Built automatically from tag \`${TAG}\` at commit \`${GITHUB_SHA}\`.

          ### Install
          - Sideload the APK: \`adb install -r ${APK_NAME}\`
          - Play Store: upload the AAB in the Play Console

          ### Signing certificate
          \`SHA-256: ${CERT_SHA256}\`

          ### FCM
          \`${FCM_STATUS}\`

          ### Checksums
          See \`SHA256SUMS.txt\` for both artifacts.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "NEWBIZZ Android v${VERSION} (${VERSION_CODE})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft=false
            gh release upload "$TAG" \
              "dist/$APK_NAME" \
              "dist/$AAB_NAME" \
              "dist/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/$APK_NAME#Android APK (sideload)" \
              "dist/$AAB_NAME#Android App Bundle (Play Store)" \
              "dist/SHA256SUMS.txt#SHA-256 checksums" \
              --title "NEWBIZZ Android v${VERSION} (${VERSION_CODE})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
